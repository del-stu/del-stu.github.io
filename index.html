<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfDEL Lab GitHub Pages</title>
    <link rel="icon" href="infdel.svg">
    <style>
        :root {
            --bg-color: #08090a;
            --text-color: #d1d5db;
            --accent-green: #10b981;
            --accent-dim: #4b5563;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Subtle Terminal Scanline / Glow effect */
        .terminal-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .system-line {
            color: var(--accent-dim);
            font-size: 0.85rem;
            user-select: none;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-green);
            font-weight: 500;
        }

        .prompt-symbol {
            color: var(--accent-green);
        }

        .cmd-text {
            color: #f3f4f6;
        }

        .notice-card {
            border-left: 2px solid var(--accent-green);
            padding-left: 1.25rem;
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .lang-block {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .lang-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-dim);
            font-weight: 600;
        }

        .notice-text {
            color: #f9fafb;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .cli-input {
            background: transparent;
            border: none;
            outline: none;
            color: #f3f4f6;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            flex: 1;
            caret-color: var(--accent-green);
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.1em;
            background-color: var(--accent-green);
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .output-history {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 1.25rem 1rem;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="terminal-container" id="terminal">
        <div class="system-line">
            Loaded "gh.infdel.qzz.io"
        </div>

        <div class="prompt-line">
            <span class="prompt-symbol">user@localhost:~$</span>
            <span class="cmd-text">cat ./info</span>
        </div>
        <div class="notice-card">
            <div class="lang-block">
                <span class="lang-tag">// ENGLISH</span>
                <p class="notice-text">
                    Notice: This subdomain's index has no content. It's use for GitHub Pages.
                </p>
            </div>
            <div class="lang-block">
                <span class="lang-tag">// 中文</span>
                <p class="notice-text">
                    此子域名首页未放置任何内容，仅用于 GitHub Pages 页面的路由。
                </p>
            </div>
        </div>
        <div class="prompt-line">
            <span class="prompt-symbol">user@localhost:~$</span>
            <input type="text" class="cli-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</body>
</html>
